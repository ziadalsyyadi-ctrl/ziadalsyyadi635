name: Build and publish Bank AlDam Qataba OTA

on:
  repository_dispatch:
    types:
      - build-ota
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Source branch or commit SHA in ziadalsyyadi-ctrl/ziad"
        required: false
        default: "main"

permissions:
  contents: write

jobs:
  dispatch-from-private:
    name: Forward manual OTA request to ziadalsyyadi635
    if: github.repository != 'ziadalsyyadi-ctrl/ziadalsyyadi635' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch OTA build to ziadalsyyadi635
        env:
          GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.event.inputs.source_ref || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GH_RELEASE_TOKEN:-}" ]; then
            echo "::error::Missing repository secret GH_RELEASE_TOKEN."
            exit 1
          fi
          PAYLOAD=$(node -e '
            console.log(JSON.stringify({
              event_type: "build-ota",
              client_payload: {
                source_repo: process.env.SOURCE_REPO,
                source_sha: process.env.SOURCE_SHA,
                source_ref: process.env.SOURCE_REF
              }
            }));
          ')
          HTTP_CODE=$(curl -sS -o /tmp/dispatch_resp.txt -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_RELEASE_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "https://api.github.com/repos/ziadalsyyadi-ctrl/ziadalsyyadi635/dispatches")
          if [ "$HTTP_CODE" != "204" ]; then
            cat /tmp/dispatch_resp.txt || true
            echo "::error::Failed to trigger build-ota dispatch on ziadalsyyadi-ctrl/ziadalsyyadi635 (HTTP $HTTP_CODE)."
            exit 1
          fi
          echo "Dispatched OTA build to ziadalsyyadi-ctrl/ziadalsyyadi635 for ${SOURCE_REPO}@${SOURCE_REF}."

  build-and-publish:
    name: Build OTA from private source and publish to public Releases
    if: github.repository == 'ziadalsyyadi-ctrl/ziadalsyyadi635'
    runs-on: ubuntu-latest
    steps:
      - name: Verify access to source repository
        env:
          REPO_TOKEN: ${{ secrets.ZIAD_REPO_TOKEN || secrets.GH_RELEASE_TOKEN }}
          SOURCE_REPO: ${{ github.event.client_payload.source_repo || 'ziadalsyyadi-ctrl/ziad' }}
        shell: bash
        run: |
          set -euo pipefail
          AUTH_ARGS=()
          if [ -n "${REPO_TOKEN:-}" ]; then
            AUTH_ARGS=(-H "Authorization: Bearer ${REPO_TOKEN}")
          fi
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' "${AUTH_ARGS[@]}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${SOURCE_REPO}")
          if [ "$STATUS" != "200" ]; then
            echo "::error::Cannot access ${SOURCE_REPO} (HTTP ${STATUS}). If ${SOURCE_REPO} is private, add secret ZIAD_REPO_TOKEN (with repo read access to ziad) in ziadalsyyadi635."
            exit 1
          fi

      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.source_repo || 'ziadalsyyadi-ctrl/ziad' }}
          ref: ${{ github.event.client_payload.source_sha || github.event.inputs.source_ref || 'main' }}
          token: ${{ secrets.ZIAD_REPO_TOKEN || secrets.GH_RELEASE_TOKEN || github.token }}
          persist-credentials: false

      - name: Resolve source commit SHA for bundle ID
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          echo "BUNDLE_ID=${SOURCE_SHA}" >> "$GITHUB_ENV"
          echo "Resolved OTA bundle ID from source commit: ${SOURCE_SHA}"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Resolve sequential OTA version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          PUBLISHED_PATCH=-1

          OTA_JSON="$(curl -sS -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/ziadalsyyadi-ctrl/ziadalsyyadi635/releases/tags/ota-latest" || true)"

          if echo "$OTA_JSON" | grep -q '"tag_name"'; then
            PUBLISHED_PATCH=0
            BODY_PATCH="$(echo "$OTA_JSON" | node -e '
              let d=""; process.stdin.on("data",c=>d+=c); process.stdin.on("end",()=>{
                try {
                  const j = JSON.parse(d);
                  const m = String(j.body || "").match(/App Version:\s*1\.2\.(\d+)/i);
                  if (m) console.log(m[1]);
                } catch {}
              });
            ')"
            if [ -n "$BODY_PATCH" ] && [ "$BODY_PATCH" -gt "$PUBLISHED_PATCH" ]; then
              PUBLISHED_PATCH="$BODY_PATCH"
            fi
            NEXT_PATCH=$(( PUBLISHED_PATCH + 1 ))
          else
            NEXT_PATCH=$(( GITHUB_RUN_NUMBER > 7 ? GITHUB_RUN_NUMBER - 7 : 0 ))
          fi

          APP_VER="1.2.${NEXT_PATCH}"
          echo "VITE_APP_VERSION=${APP_VER}" >> "$GITHUB_ENV"
          echo "Resolved sequential OTA appVersion=${APP_VER}"

      - name: Build web application
        run: npm run build

      - name: Create and sign OTA ZIP
        env:
          OTA_PRIVATE_KEY: ${{ secrets.OTA_PRIVATE_KEY }}
          BUNDLE_ID: ${{ env.BUNDLE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${OTA_PRIVATE_KEY:-}" ]; then
            echo "::error::Missing repository secret OTA_PRIVATE_KEY."
            exit 1
          fi

          mkdir -p .ota-work ota-dist/bundles
          printf '%s\n' "$OTA_PRIVATE_KEY" > .ota-work/private.pem
          chmod 600 .ota-work/private.pem

          # Refuse to sign if the private key is not the pair of the public key embedded in the APK.
          openssl pkey -in .ota-work/private.pem -pubout -out .ota-work/derived-public.pem
          node <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
          const expected = config.plugins?.LiveUpdate?.publicKey;
          if (typeof expected !== 'string' || !expected.includes('BEGIN PUBLIC KEY')) {
            throw new Error('LiveUpdate publicKey is missing from capacitor.config.json');
          }
          const normalized = value => value.replace(/\s/g, '');
          const derived = fs.readFileSync('.ota-work/derived-public.pem', 'utf8');
          if (normalized(expected) !== normalized(derived)) {
            throw new Error('OTA_PRIVATE_KEY does not match the public key embedded in capacitor.config.json');
          }
          console.log('OTA signing key pair verified.');
          NODE

          ZIP_PATH="$GITHUB_WORKSPACE/ota-dist/bundles/${BUNDLE_ID}.zip"
          (cd dist && zip -qr "$ZIP_PATH" .)

          CHECKSUM="$(sha256sum "$ZIP_PATH" | awk '{print $1}')"
          openssl dgst -sha256 -sign .ota-work/private.pem -out .ota-work/signature.bin "$ZIP_PATH"
          SIGNATURE="$(base64 -w 0 .ota-work/signature.bin)"
          echo "CHECKSUM=$CHECKSUM" >> "$GITHUB_ENV"
          echo "SIGNATURE=$SIGNATURE" >> "$GITHUB_ENV"

      - name: Publish OTA ZIP to public GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          repository: ziadalsyyadi-ctrl/ziadalsyyadi635
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ota-${{ env.BUNDLE_ID }}
          name: Bank AlDam OTA ${{ env.BUNDLE_ID }}
          target_commitish: main
          files: ota-dist/bundles/${{ env.BUNDLE_ID }}.zip
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: false

      - name: Create OTA manifest
        env:
          BUNDLE_ID: ${{ env.BUNDLE_ID }}
          CHECKSUM: ${{ env.CHECKSUM }}
          SIGNATURE: ${{ env.SIGNATURE }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const bundleId = process.env.BUNDLE_ID;
          const manifest = {
            bundleId,
            url: `https://github.com/ziadalsyyadi-ctrl/ziadalsyyadi635/releases/download/ota-${bundleId}/${bundleId}.zip`,
            checksum: process.env.CHECKSUM,
            signature: process.env.SIGNATURE
          };
          fs.writeFileSync('ota-dist/manifest.json', JSON.stringify(manifest, null, 2) + '\n');
          NODE

      - name: Publish OTA manifest to Bank AlDam Downloads release
        uses: softprops/action-gh-release@v2
        with:
          repository: ziadalsyyadi-ctrl/ziadalsyyadi635
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ota-latest
          name: Bank AlDam OTA manifest v${{ env.VITE_APP_VERSION }} (latest)
          body: |
            App Version: ${{ env.VITE_APP_VERSION }}
            Bundle ID: ${{ env.BUNDLE_ID }}
          target_commitish: main
          files: ota-dist/manifest.json
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: false
